name: Publish installer as a GitHub Release

# Turns a branch named installer-v<version> (holding only the installer .exe,
# its .sha256.txt and, from 0.21.0 on, latest.yml + .blockmap) into the
# GitHub Release v<version>, which is what noorshield.com's download buttons
# link to and what the app's automatic updater checks. Run it from the
# Actions tab.
#
# This repo exists only to serve those downloads publicly: the website and
# app source stay in private repos, and a private repo's release files can't
# be downloaded by visitors. Keeping each installer on its own branch, not in
# main, keeps main tiny and its history free of 75 MB files.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.19.4 (needs branch installer-v<version>)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version looks right
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 0.19.4, got '$VERSION'."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: installer-v${{ inputs.version }}

      - name: Verify the checksum
        run: |
          set -euo pipefail
          exe="Noor-Shield-Setup-$VERSION.exe"
          test -f "$exe" && test -f "$exe.sha256.txt"
          expected=$(awk '{print tolower($1)}' "$exe.sha256.txt")
          actual=$(sha256sum "$exe" | awk '{print $1}')
          if [ "$expected" != "$actual" ]; then
            echo "::error::Checksum mismatch: file is $actual, .sha256.txt says $expected."
            exit 1
          fi
          echo "Checksum OK: $actual"
          # Automatic updates (0.21.0+): latest.yml must point at this exact
          # installer, with its SHA-512 — the app refuses an update otherwise.
          if [ -f latest.yml ]; then
            grep -q "path: $exe" latest.yml || { echo "::error::latest.yml doesn't name $exe"; exit 1; }
            sha512=$(openssl dgst -sha512 -binary "$exe" | base64 -w0)
            grep -q "sha512: $sha512" latest.yml || { echo "::error::latest.yml's sha512 doesn't match $exe"; exit 1; }
            echo "latest.yml OK (automatic updates)"
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("Noor-Shield-Setup-$VERSION.exe" "Noor-Shield-Setup-$VERSION.exe.sha256.txt")
          [ -f latest.yml ] && files+=("latest.yml")
          [ -f "Noor-Shield-Setup-$VERSION.exe.blockmap" ] && files+=("Noor-Shield-Setup-$VERSION.exe.blockmap")
          gh release create "v$VERSION" \
            "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "Noor Shield $VERSION" \
            --notes "Windows installer for Noor Shield $VERSION (Windows 10 and 11). The .sha256.txt file alongside it lets you check the download wasn't corrupted or altered."
